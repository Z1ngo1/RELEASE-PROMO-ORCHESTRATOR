<svg viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c9c9c9"/>
    </marker>
  </defs>

  <rect width="1400" height="1080" fill="#0A0C0F"/>

  <!-- Browser -->
  <rect x="560" y="30" width="220" height="70" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="670" y="72" fill="#EDEDED" font-size="20" text-anchor="middle">Browser</text>

  <!-- Browser -> Flask -->
  <line x1="670" y1="100" x2="670" y2="168" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="118" width="180" height="30" fill="#3a3d42"/>
  <text x="670" y="138" fill="#EDEDED" font-size="14" text-anchor="middle">HTML forms + fetch</text>

  <!-- Flask -->
  <rect x="500" y="170" width="340" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="670" y="205" fill="#EDEDED" font-size="20" text-anchor="middle">Python Flask</text>
  <text x="670" y="230" fill="#9aa0a6" font-size="16" text-anchor="middle">frontend/python/app.py</text>

  <!-- Flask -> CICS -->
  <line x1="670" y1="250" x2="670" y2="333" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="545" y="268" width="250" height="48" fill="#3a3d42"/>
  <text x="670" y="286" fill="#EDEDED" font-size="14" text-anchor="middle">HTTP GET / POST / PUT</text>
  <text x="670" y="304" fill="#EDEDED" font-size="14" text-anchor="middle">via requests lib</text>

  <!-- CICS Web Support -->
  <rect x="440" y="335" width="460" height="105" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="670" y="368" fill="#EDEDED" font-size="20" text-anchor="middle">CICS Web Support</text>
  <text x="670" y="393" fill="#9aa0a6" font-size="16" text-anchor="middle">TCPIPSERVICE DFH$WUTC</text>
  <text x="670" y="416" fill="#9aa0a6" font-size="16" text-anchor="middle">port 4558</text>

  <!-- CICS -> 4 programs -->
  <line x1="560" y1="440" x2="140" y2="560" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="440" x2="380" y2="560" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="440" x2="620" y2="560" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="440" x2="860" y2="560" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="483" width="170" height="26" fill="#3a3d42"/>
  <text x="140" y="501" fill="#EDEDED" font-size="12" text-anchor="middle">URIMAP routes to CWBA</text>
  <rect x="295" y="483" width="170" height="26" fill="#3a3d42"/>
  <text x="380" y="501" fill="#EDEDED" font-size="12" text-anchor="middle">URIMAP routes to CWBA</text>
  <rect x="535" y="483" width="170" height="26" fill="#3a3d42"/>
  <text x="620" y="501" fill="#EDEDED" font-size="12" text-anchor="middle">URIMAP routes to CWBA</text>
  <rect x="775" y="483" width="170" height="26" fill="#3a3d42"/>
  <text x="860" y="501" fill="#EDEDED" font-size="12" text-anchor="middle">URIMAP routes to CWBA</text>

  <!-- 4 program boxes -->
  <rect x="40" y="562" width="200" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="140" y="596" fill="#EDEDED" font-size="18" text-anchor="middle">RELSMGR</text>
  <text x="140" y="619" fill="#9aa0a6" font-size="14" text-anchor="middle">COBOL / CICS</text>

  <rect x="280" y="562" width="200" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="380" y="596" fill="#EDEDED" font-size="18" text-anchor="middle">PROMGR</text>
  <text x="380" y="619" fill="#9aa0a6" font-size="14" text-anchor="middle">COBOL / CICS</text>

  <rect x="520" y="562" width="200" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="620" y="596" fill="#EDEDED" font-size="18" text-anchor="middle">CLASHRDR</text>
  <text x="620" y="619" fill="#9aa0a6" font-size="14" text-anchor="middle">COBOL / CICS, read only</text>

  <rect x="760" y="562" width="200" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="860" y="596" fill="#EDEDED" font-size="18" text-anchor="middle">EVTMGR</text>
  <text x="860" y="619" fill="#9aa0a6" font-size="14" text-anchor="middle">COBOL / CICS</text>

  <!-- programs -> DB2 -->
  <line x1="140" y1="642" x2="470" y2="800" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="642" x2="500" y2="800" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="642" x2="560" y2="800" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="642" x2="620" y2="800" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="700" width="90" height="26" fill="#3a3d42"/>
  <text x="105" y="718" fill="#EDEDED" font-size="12" text-anchor="middle">EXEC SQL</text>

  <!-- JCL job + CLSHBAT -->
  <rect x="1080" y="335" width="240" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="1200" y="369" fill="#EDEDED" font-size="18" text-anchor="middle">JCL Job</text>
  <text x="1200" y="392" fill="#9aa0a6" font-size="16" text-anchor="middle">CLSHJCL</text>

  <line x1="1200" y1="415" x2="1200" y2="558" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1150" y="470" width="100" height="26" fill="#3a3d42"/>
  <text x="1200" y="488" fill="#EDEDED" font-size="12" text-anchor="middle">runs</text>

  <rect x="1080" y="562" width="240" height="80" rx="4" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="1200" y="596" fill="#EDEDED" font-size="18" text-anchor="middle">CLSHBAT</text>
  <text x="1200" y="619" fill="#9aa0a6" font-size="14" text-anchor="middle">Batch COBOL</text>

  <line x1="1150" y1="642" x2="800" y2="800" stroke="#c9c9c9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1120" y="700" width="90" height="26" fill="#3a3d42"/>
  <text x="1165" y="718" fill="#EDEDED" font-size="12" text-anchor="middle">EXEC SQL</text>

  <!-- DB2 cylinder -->
  <ellipse cx="670" cy="805" rx="220" ry="24" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <rect x="450" y="805" width="440" height="180" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <ellipse cx="670" cy="985" rx="220" ry="24" fill="#15181D" stroke="#3a3d42" stroke-width="1.5"/>
  <line x1="450" y1="805" x2="450" y2="985" stroke="#3a3d42" stroke-width="1.5"/>
  <line x1="890" y1="805" x2="890" y2="985" stroke="#3a3d42" stroke-width="1.5"/>

  <text x="670" y="848" fill="#EDEDED" font-size="20" text-anchor="middle">DB2</text>
  <text x="670" y="878" fill="#9aa0a6" font-size="15" text-anchor="middle">RELEASE_T</text>
  <text x="670" y="900" fill="#9aa0a6" font-size="15" text-anchor="middle">PROMO_T</text>
  <text x="670" y="922" fill="#9aa0a6" font-size="15" text-anchor="middle">CLASH_SCORE_T</text>
  <text x="670" y="944" fill="#9aa0a6" font-size="15" text-anchor="middle">EXT_EVENT_T</text>
  <text x="670" y="966" fill="#9aa0a6" font-size="15" text-anchor="middle">CHANGE_LOG</text>
</svg>
